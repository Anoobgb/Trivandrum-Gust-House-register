name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "Trivandrum_Guest_House_Android_Test_Project/**"
      - ".github/workflows/build-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trivandrum_Guest_House_Android_Test_Project
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: Trivandrum_Guest_House_Android_Test_Project/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-house-register-debug-apk
          path: Trivandrum_Guest_House_Android_Test_Project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
